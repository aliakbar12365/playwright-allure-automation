
name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-playwright allure-pytest
          python -m playwright install --with-deps chromium

          sudo apt-get update
          sudo apt-get install -y default-jre

          npm install -g allure-commandline

      # - name: Run Playwright tests
      #   run: |
      #     python -m pytest tests/ -v --alluredir=allure-results
      
      - name: Run Playwright tests
        run: |
          python -m pytest tests/ -v \
            --video on \
            --alluredir=allure-results \
            --clean-alluredir


      - name: Check Allure video attachments
        if: always()
        run: |
          echo "=== Video attachments in Allure results ==="
          find allure-results -type f -name "*.webm" -print

          echo "=== Allure attachment metadata ==="
          grep -l '"type":"video/webm"' allure-results/*-result.json || true

          echo "=== Generated report videos ==="
          find allure-report -type f -name "*.webm" -print 2>/dev/null || true

      - name: Generate Allure report
        if: always()
        run: |
          allure generate allure-results -o allure-report --clean

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: ignore
